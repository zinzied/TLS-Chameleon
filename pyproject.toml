[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tls-chameleon"
version = "3.0.1"
description = "Fingerprint-aware HTTP networking toolkit: pluggable TLS/HTTP backends, structured fingerprint research, diagnostics, and reproducible experiments"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Zinzied" }]
keywords = ["tls", "fingerprint", "http-client", "ja3", "ja4", "http2", "diagnostics", "networking"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.26.0",
  "cryptography>=3.4.0",
]

[project.optional-dependencies]
# Real TLS fingerprint impersonation via curl-impersonate (preferred when installed)
curl = [
  "curl_cffi>=0.6.0",
]
# "Native" backend on the primp/rustls-fork stack (no curl required for spoofing)
native = [
  "primp>=1.3,<2",
]
ai = [
  "google-generativeai",
  "anthropic",
  "openai"
]
updater = [
  "httpx>=0.26.0",
]
http3 = [
  "httpx[http3]>=0.26.0"
]
all = [
  "curl_cffi>=0.6.0",
  "primp>=1.3,<2",
  "google-generativeai",
  "anthropic",
  "openai",
]

[project.scripts]
chameleon = "tls_chameleon.cli.main:main"

[tool.setuptools.packages.find]
include = ["tls_chameleon*"]

[tool.ruff]
line-length = 110
target-version = "py38"

[tool.ruff.lint]
# Correctness-first selection; style noise is out of scope for v3.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
